name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: unzip -q ClearSight-v1.1.zip
      - name: Build debug APK
        working-directory: ClearSight
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp ClearSight/app/build/outputs/apk/debug/app-debug.apk ClearSight-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClearSight-v1.1-apk
          path: ClearSight-v1.1.apk
